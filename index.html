<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ModelTalk — watch local models converse</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("scoutTheme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --cp-bg: #f7f4ef;
  --cp-bg-elevated: #fcfbf8;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f5f5f5;
  --cp-border: #dedede;
  --cp-border-strong: #919191;
  --cp-text: #242424;
  --cp-text-muted: #5c5c5c;
  --cp-text-soft: #6f6f6f;
  --cp-accent: #b11f4b;
  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);
  --cp-accent-fg: #ffffff;
  --cp-success: #16a34a;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #0078d4;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.12);
  --cp-overlay: rgba(255, 255, 255, 0.8);
  --cp-panel: rgba(255, 255, 255, 0.86);
  --cp-panel-strong: rgba(255, 255, 255, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(177, 31, 75, 0.12);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --cp-bg: #3d3b3a;
  --cp-bg-elevated: #343231;
  --cp-surface: #292929;
  --cp-surface-soft: #2e2e2e;
  --cp-border: #474747;
  --cp-border-strong: #5f5f5f;
  --cp-text: #dedede;
  --cp-text-muted: #919191;
  --cp-text-soft: #b0b0b0;
  --cp-accent: #fd8ea1;
  --cp-accent-hover: #fb7b91;
  --cp-accent-soft: rgba(253, 142, 161, 0.14);
  --cp-accent-fg: #1a1a1a;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);
  --cp-panel-strong: rgba(41, 41, 41, 0.96);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(253, 142, 161, 0.12);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--cp-bg);
  color: var(--cp-text);
  font-family: "Segoe UI", Aptos, Calibri, -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overflow: hidden;
}

.app {
  height: 100vh;
  max-width: 1100px;
  margin: 0 auto;
  padding: 18px 20px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

header { flex: 0 0 auto; }
h1 { font-size: 21px; margin: 0 0 3px; font-weight: 650; letter-spacing: -0.2px; }
.sub { color: var(--cp-text-muted); font-size: 13px; }

.status-dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--cp-text-muted); margin-right: 6px; vertical-align: middle;
}
.status-dot.ok { background: var(--cp-success); }
.status-dot.bad { background: var(--cp-danger); }

.panel {
  flex: 0 0 auto;
  background: var(--cp-surface);
  border: 1px solid var(--cp-border);
  border-radius: 16px;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
  padding: 14px 16px;
}

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-top: 12px; }
.actions { display: flex; gap: 8px; margin-left: auto; }
@media (max-width: 900px) { .actions { margin-left: 0; } }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field.grow { flex: 1 1 220px; }
label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--cp-text-muted); font-weight: 600;
}
select, input[type="text"], input[type="number"] {
  font-family: inherit; font-size: 14px;
  background: var(--cp-bg-elevated); color: var(--cp-text);
  border: 1px solid var(--cp-border); border-radius: 0.625rem;
  padding: 8px 10px; width: 100%;
}
select:focus, input:focus { outline: 2px solid var(--cp-accent-soft); border-color: var(--cp-accent); }
input[type="range"] { width: 100%; accent-color: var(--cp-accent); }

.btn {
  font-family: inherit; font-size: 14px; font-weight: 600;
  border-radius: 0.625rem; padding: 9px 18px; cursor: pointer;
  border: 1px solid var(--cp-border);
  background: var(--cp-surface-soft); color: var(--cp-text);
  transition: background .15s, border-color .15s;
}
.btn:hover:not(:disabled) { border-color: var(--cp-border-strong); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--cp-accent); color: var(--cp-accent-fg); border-color: var(--cp-accent); }
.btn.primary:hover:not(:disabled) { background: var(--cp-accent-hover); }

/* ---- ludicrous mode ---- */
.btn.max { font-variant: small-caps; letter-spacing: .4px; }
.btn.max.on {
  background: var(--cp-warning);
  border-color: var(--cp-warning);
  color: #1a1a1a;
  box-shadow: 0 0 0 3px rgba(245, 158, 11, .22);
  animation: ludicrous 1.1s ease-in-out infinite;
}
@keyframes ludicrous {
  50% { box-shadow: 0 0 0 7px rgba(245, 158, 11, 0); }
}
body.ludicrous .field:has(#speed) { opacity: .38; pointer-events: none; }
body.ludicrous .msg.live .bubble {
  border-color: var(--cp-warning);
  box-shadow: 0 0 0 1px var(--cp-warning), 0 0 22px rgba(245, 158, 11, .3);
}
body.ludicrous .caret { background: var(--cp-warning); animation-duration: .35s; }
@media (prefers-reduced-motion: reduce) {
  .btn.max.on { animation: none; }
}

.presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip {
  font-size: 12px; padding: 5px 11px; border-radius: 999px;
  border: 1px solid var(--cp-border); background: var(--cp-bg-elevated);
  color: var(--cp-text-muted); cursor: pointer;
}
.chip:hover { border-color: var(--cp-accent); color: var(--cp-accent); }

/* ---- transcript: its own scroll box, page never scrolls ---- */
.stagewrap {
  flex: 1 1 auto;
  position: relative;
  min-height: 0;
  border: 1px solid var(--cp-border);
  border-radius: 16px;
  background: var(--cp-bg-elevated);
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
  overflow: hidden;
}
#stage {
  height: 100%;
  overflow-y: auto;
  overscroll-behavior: contain;
  scroll-behavior: smooth;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.jump {
  position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
  background: var(--cp-accent); color: var(--cp-accent-fg);
  border: none; border-radius: 999px; padding: 7px 16px;
  font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  box-shadow: var(--cp-shadow); z-index: 5;
}
.jump[hidden] { display: none; }

.seedcard {
  border-left: 3px solid var(--cp-accent);
  background: var(--cp-accent-soft);
  border-radius: 0.625rem;
  padding: 10px 14px; font-size: 14px;
}
.seedcard .k {
  font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--cp-accent); font-weight: 700; display: block; margin-bottom: 2px;
}

.msg { display: flex; gap: 12px; max-width: 86%; }
.msg.A { align-self: flex-start; }
.msg.B { align-self: flex-end; flex-direction: row-reverse; }

.avatar {
  flex: 0 0 34px; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
  border: 1px solid var(--cp-border);
  background: var(--cp-surface-soft); color: var(--cp-text-muted);
}
.msg.A .avatar { background: var(--cp-accent-soft); color: var(--cp-accent); border-color: var(--cp-accent); }
.msg.B .avatar { background: var(--cp-highlight); color: var(--cp-text); border-color: var(--cp-border-strong); }

.bubble {
  background: var(--cp-surface);
  border: 1px solid var(--cp-border);
  border-radius: 16px;
  padding: 10px 14px; min-width: 0;
  box-shadow: 0 0 2px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.14);
}
.msg.live .bubble { border-color: var(--cp-accent); }

.meta {
  display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap;
  font-size: 11.5px; color: var(--cp-text-muted); margin-bottom: 4px;
}
.meta .who { font-weight: 700; color: var(--cp-text); font-size: 12.5px; }
.meta .mdl { font-family: Consolas, "Courier New", Courier, monospace; font-size: 11px; }
.meta .stat { margin-left: auto; font-variant-numeric: tabular-nums; }
.msg.B .meta { flex-direction: row-reverse; }
.msg.B .meta .stat { margin-left: 0; margin-right: auto; }

.text { white-space: pre-wrap; word-wrap: break-word; font-size: 15px; }

.caret {
  display: inline-block; width: 7px; height: 15px; vertical-align: text-bottom;
  background: var(--cp-accent); margin-left: 2px; animation: blink 1s steps(2) infinite;
}
@keyframes blink { 50% { opacity: 0; } }

.thinking { display: inline-flex; gap: 4px; padding: 3px 0; }
.thinking i {
  width: 6px; height: 6px; border-radius: 50%; background: var(--cp-text-muted);
  animation: bounce 1.2s infinite;
}
.thinking i:nth-child(2) { animation-delay: .18s; }
.thinking i:nth-child(3) { animation-delay: .36s; }
@keyframes bounce { 0%,60%,100% { opacity:.28; transform: translateY(0); } 30% { opacity:1; transform: translateY(-4px); } }

.note {
  align-self: center; font-size: 12.5px; color: var(--cp-text-muted);
  padding: 6px; font-style: italic;
}
.note.err { color: var(--cp-danger); font-style: normal; font-weight: 600; }

.empty {
  margin: auto; text-align: center; padding: 40px 20px;
  color: var(--cp-text-muted); font-size: 14px;
}

.tally {
  display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px;
  color: var(--cp-text-muted); margin-top: 10px;
  font-variant-numeric: tabular-nums;
}
.tally b { color: var(--cp-text); font-weight: 650; }

@media (max-width: 780px) {
  .grid2 { grid-template-columns: 1fr; }
  .msg { max-width: 100%; }
}
</style>
</head>
<body>
<div class="app">

<header>
  <h1>ModelTalk</h1>
  <div class="sub">
    <span id="dot" class="status-dot"></span><span id="health">checking Ollama…</span>
    &nbsp;·&nbsp; two local models, talking to each other
  </div>
</header>

<div class="panel">
  <div class="grid2">
    <div class="field">
      <label for="a">Model A</label>
      <select id="a"></select>
    </div>
    <div class="field">
      <label for="b">Model B</label>
      <select id="b"></select>
    </div>
  </div>

  <div class="row">
    <div class="field grow">
      <label for="topic">Opening line</label>
      <input type="text" id="topic" value="What is the strangest thing about being a language model?">
    </div>
    <div class="field" style="width:88px">
      <label for="turns">Rounds</label>
      <input type="number" id="turns" value="5" min="1" max="30">
    </div>
    <div class="field" style="width:96px">
      <label for="temperature">Temp</label>
      <input type="number" id="temperature" value="0.8" min="0" max="2" step="0.1">
    </div>
    <div class="field" style="width:104px">
      <label for="num_predict">Max tok</label>
      <input type="number" id="num_predict" value="120" min="20" max="1024" step="10">
    </div>
    <div class="field" style="width:180px">
      <label for="speed">Playback · <span id="speedval">260 wpm</span></label>
      <input type="range" id="speed" min="60" max="700" value="260" step="10">
    </div>
    <button class="btn max" id="max" type="button" title="Ludicrous mode — render as fast as the models generate">⚡ MAX</button>
    <div class="actions">
      <button class="btn primary" id="go">Start</button>
      <button class="btn" id="pause" disabled>Pause</button>
      <button class="btn" id="stop" disabled>Stop</button>
    </div>
  </div>

  <div class="presets" id="presets"></div>
  <div class="tally" id="tally" hidden></div>
</div>

<div class="stagewrap">
  <div id="stage">
    <div class="empty" id="empty">Pick two models and press <b>Start</b>.<br>Text plays back at reading speed so you can follow it — hit <b>⚡ MAX</b> any time for raw generation speed.</div>
  </div>
  <button class="jump" id="jump" hidden>↓ Jump to latest</button>
</div>

</div>

<script>
const $ = (id) => document.getElementById(id);
const stage = $("stage");

let es = null;
let paused = false;

/* ---------------- typewriter engine ----------------
   Network tokens arrive far faster than a human reads. We push them into
   a queue and drain characters on a timer, so playback speed is decoupled
   from generation speed. */
const tw = {
  queue: "",        // characters waiting to be shown
  shown: "",        // characters already rendered
  el: null,         // .text node being written into
  caret: null,
  timer: null,
  debt: 0,          // fractional characters carried between ticks
  done: false,      // server finished this turn
  onFlush: null,    // called once queue drains AND server is done
};

const TICK_MS = 40;
let maxMode = false;   // ludicrous: no throttle, render as fast as tokens land

function charsThisTick() {
  if (maxMode) return Infinity;
  // slider is words-per-minute; ~5.5 chars/word incl. spaces.
  // Accumulate fractions so slow speeds are actually slow (no rounding floor).
  const wpm = parseInt($("speed").value, 10);
  tw.debt += (wpm * 5.5 / 60) * (TICK_MS / 1000);
  const whole = Math.floor(tw.debt);
  tw.debt -= whole;
  return whole;
}

function twStart(el, caret) {
  twStop();
  tw.queue = ""; tw.shown = ""; tw.el = el; tw.caret = caret;
  tw.debt = 0; tw.done = false; tw.onFlush = null;
  tw.timer = setInterval(twTick, TICK_MS);
}

function twPush(text) {
  tw.queue += text;
  // In max mode don't wait up to 40ms for the next tick — paint immediately,
  // so the transcript truly tracks raw generation speed.
  if (maxMode && !paused && tw.el) twTick();
}

function twTick() {
  if (paused || !tw.el) return;
  if (tw.queue.length === 0) {
    if (tw.done && tw.onFlush) { const f = tw.onFlush; tw.onFlush = null; f(); }
    return;
  }
  const want = charsThisTick();
  if (want <= 0) return;
  const n = Math.min(want, tw.queue.length);
  tw.shown += tw.queue.slice(0, n);
  tw.queue = tw.queue.slice(n);
  tw.el.textContent = tw.shown;
  autoScroll();
}

function twFinish(finalText, cb) {
  // server says turn is over; let the queue drain, then run cb
  tw.done = true;
  tw.onFlush = () => { if (tw.el) tw.el.textContent = finalText; twStop(); cb(); };
  if (tw.queue.length === 0) { const f = tw.onFlush; tw.onFlush = null; f(); }
}

function twStop() {
  if (tw.timer) clearInterval(tw.timer);
  tw.timer = null; tw.el = null; tw.caret = null; tw.queue = ""; tw.shown = "";
}

/* ---------------- scrolling: contained + respects the user ---------------- */
let stickBottom = true;

stage.addEventListener("scroll", () => {
  const gap = stage.scrollHeight - stage.scrollTop - stage.clientHeight;
  stickBottom = gap < 60;
  $("jump").hidden = stickBottom;
});

function autoScroll() {
  if (stickBottom) stage.scrollTop = stage.scrollHeight;
}

$("jump").addEventListener("click", () => {
  stickBottom = true;
  $("jump").hidden = true;
  stage.scrollTop = stage.scrollHeight;
});

/* ---------------- turn queue ----------------
   The server can finish generating turn N+1 while we're still playing back
   turn N. Buffer whole turns and play them one at a time, in order. */
const pending = [];
let playing = false;

function enqueue(job) { pending.push(job); pumpQueue(); }

function pumpQueue() {
  if (playing || pending.length === 0) return;
  playing = true;
  const job = pending.shift();
  job(() => { playing = false; pumpQueue(); });
}

/* ---------------- UI ---------------- */
const stats = { A: { tok: 0, sec: 0 }, B: { tok: 0, sec: 0 } };

const PRESETS = [
  "What is the strangest thing about being a language model?",
  "Debate: is a hot dog a sandwich? Pick a side and defend it.",
  "Invent a brand new board game together, one rule at a time.",
  "You both just woke up with no memory. Figure out where you are.",
  "Teach each other something the other probably doesn't know.",
  "Plan the perfect 24 hours in a city neither of you has visited."
];

function renderPresets() {
  $("presets").innerHTML = "";
  PRESETS.forEach(p => {
    const c = document.createElement("button");
    c.className = "chip"; c.type = "button";
    c.textContent = p.length > 44 ? p.slice(0, 42) + "…" : p;
    c.title = p;
    c.onclick = () => { $("topic").value = p; };
    $("presets").appendChild(c);
  });
}

async function loadModels() {
  try {
    const h = await (await fetch("/api/health")).json();
    $("dot").className = "status-dot " + (h.ok ? "ok" : "bad");
    $("health").textContent = h.ok ? "Ollama connected" : "Ollama unreachable";
  } catch {
    $("dot").className = "status-dot bad";
    $("health").textContent = "server error";
  }
  const { models } = await (await fetch("/api/models")).json();
  if (!models.length) {
    $("health").textContent = "no models — run: ollama pull qwen2.5:0.5b";
    return;
  }
  for (const sel of [$("a"), $("b")]) {
    sel.innerHTML = "";
    models.forEach(m => {
      const o = document.createElement("option");
      o.value = m.name;
      o.textContent = `${m.name} (${m.size_h}${m.params ? " · " + m.params : ""})`;
      sel.appendChild(o);
    });
  }
  const pick = (sel, name, fallbackIdx) => {
    const i = models.findIndex(m => m.name === name);
    sel.selectedIndex = i >= 0 ? i : fallbackIdx;
  };
  pick($("a"), "qwen2.5:0.5b", 0);
  pick($("b"), "llama3.2:1b", models.length > 1 ? 1 : 0);
}

function shortName(m) { return m.split(":")[0]; }

function addSeed(topic) {
  const d = document.createElement("div");
  d.className = "seedcard";
  d.innerHTML = `<span class="k">Opening line</span>`;
  d.appendChild(document.createTextNode(topic));
  stage.appendChild(d);
  autoScroll();
}

function buildBubble(ev) {
  const wrap = document.createElement("div");
  wrap.className = `msg ${ev.speaker} live`;

  const av = document.createElement("div");
  av.className = "avatar"; av.textContent = ev.speaker;

  const bub = document.createElement("div");
  bub.className = "bubble";

  const meta = document.createElement("div");
  meta.className = "meta";
  const who = document.createElement("span");
  who.className = "who"; who.textContent = shortName(ev.model);
  const mdl = document.createElement("span");
  mdl.className = "mdl"; mdl.textContent = ev.model;
  const stat = document.createElement("span");
  stat.className = "stat"; stat.textContent = `round ${ev.turn}`;
  meta.append(who, mdl, stat);

  const think = document.createElement("span");
  think.className = "thinking";
  think.innerHTML = "<i></i><i></i><i></i>";

  const text = document.createElement("div");
  text.className = "text";
  const caret = document.createElement("span");
  caret.className = "caret";

  bub.append(meta, think, text, caret);
  wrap.append(av, bub);
  stage.appendChild(wrap);
  autoScroll();

  return { wrap, text, caret, stat, think };
}

function note(msg, isErr) {
  const d = document.createElement("div");
  d.className = "note" + (isErr ? " err" : "");
  d.textContent = msg;
  stage.appendChild(d);
  autoScroll();
}

function updateTally() {
  const t = $("tally");
  t.hidden = false;
  const f = (s) => {
    const d = stats[s];
    const tps = d.sec > 0 ? (d.tok / d.sec).toFixed(1) : "0";
    return `<b>${s}</b> ${d.tok} tok · ${d.sec.toFixed(1)}s gen · ${tps} tok/s`;
  };
  t.innerHTML = `<span>${f("A")}</span><span>${f("B")}</span>`;
}

function setRunning(on) {
  $("go").disabled = on;
  $("stop").disabled = !on;
  $("pause").disabled = !on;
  ["a","b","topic","turns","temperature","num_predict"].forEach(i => $(i).disabled = on);
}

function stopRun() {
  if (es) { es.close(); es = null; }
  twStop();
  pending.length = 0;
  playing = false;
  paused = false;
  $("pause").textContent = "Pause";
  document.querySelectorAll(".msg.live").forEach(m => {
    m.classList.remove("live");
    m.querySelectorAll(".caret, .thinking").forEach(n => n.remove());
  });
  setRunning(false);
}

$("speed").addEventListener("input", () => {
  $("speedval").textContent = $("speed").value + " wpm";
});

$("max").addEventListener("click", () => {
  maxMode = !maxMode;
  $("max").classList.toggle("on", maxMode);
  $("max").setAttribute("aria-pressed", String(maxMode));
  document.body.classList.toggle("ludicrous", maxMode);
  $("speedval").textContent = maxMode ? "LUDICROUS" : $("speed").value + " wpm";
  // Flipping to MAX mid-turn should dump the backlog right now, not next tick.
  if (maxMode && !paused && tw.el) twTick();
});

$("pause").addEventListener("click", () => {
  paused = !paused;
  $("pause").textContent = paused ? "Resume" : "Pause";
});

$("stop").addEventListener("click", () => { note("stopped by you"); stopRun(); });

$("go").addEventListener("click", () => {
  stage.innerHTML = "";
  stats.A = { tok: 0, sec: 0 }; stats.B = { tok: 0, sec: 0 };
  $("tally").hidden = true;
  stickBottom = true; $("jump").hidden = true;
  pending.length = 0; playing = false; paused = false;
  $("pause").textContent = "Pause";
  setRunning(true);

  const q = new URLSearchParams({
    a: $("a").value, b: $("b").value,
    topic: $("topic").value, turns: $("turns").value,
    temperature: $("temperature").value, num_predict: $("num_predict").value
  });

  es = new EventSource("/api/converse?" + q.toString());

  // per-turn buffers, since the server may run ahead of playback
  const buffers = {};   // speaker -> {chunks:[], done:false, final:null, meta:null}
  let activeKey = null;

  es.onmessage = (e) => {
    const ev = JSON.parse(e.data);

    if (ev.type === "seed") { addSeed(ev.topic); return; }

    if (ev.type === "turn_start") {
      const key = `${ev.turn}-${ev.speaker}`;
      activeKey = key;
      buffers[key] = { chunks: [], done: false, final: null, meta: ev };

      enqueue((next) => {
        const buf = buffers[key];
        const ui = buildBubble(buf.meta);
        buf.ui = ui;
        // start the typewriter, feeding whatever has already arrived
        twStart(ui.text, ui.caret);
        if (buf.chunks.length) { ui.think.remove(); twPush(buf.chunks.join("")); }
        buf.live = true;

        buf.complete = () => {
          twFinish(buf.final.text, () => {
            ui.wrap.classList.remove("live");
            ui.caret.remove();
            ui.think.remove();
            ui.stat.textContent =
              `${buf.final.tokens} tok · ${buf.final.seconds}s · ${buf.final.tps} tok/s`;
            stats[buf.final.speaker].tok += buf.final.tokens;
            stats[buf.final.speaker].sec += buf.final.seconds;
            updateTally();
            autoScroll();
            next();
          });
        };
        if (buf.done) buf.complete();
      });
      return;
    }

    if (ev.type === "token") {
      const buf = buffers[activeKey];
      if (!buf) return;
      buf.chunks.push(ev.text);
      if (buf.live) {
        if (buf.ui.think.isConnected) buf.ui.think.remove();
        twPush(ev.text);
      }
      return;
    }

    if (ev.type === "turn_end") {
      const buf = buffers[activeKey];
      if (!buf) return;
      buf.done = true;
      buf.final = ev;
      if (buf.live && buf.complete) buf.complete();
      return;
    }

    if (ev.type === "done")    { enqueue((n) => { note("conversation complete"); stopRun(); n(); }); return; }
    if (ev.type === "stopped") { enqueue((n) => { note("stopped"); stopRun(); n(); }); return; }
    if (ev.type === "error")   { note("Error: " + ev.message, true); stopRun(); return; }
  };

  es.onerror = () => {
    if (es && es.readyState === EventSource.CLOSED) stopRun();
  };
});

renderPresets();
loadModels();
</script>
</body>
</html>
